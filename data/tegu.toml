# Lens table for the Google Pixel 9a (tegu, zumapro) running Omarchy Mobile,
# in the same format as data/cheetah.toml, which explains every field.
# Chosen when the device tree says google,zumapro-tegu.
#
# zoom: z = tan(FOV_main/2) / tan(FOV/2) from Google's published diagonal
#   fields of view (main 82°, ultrawide 120°, front 96.5°). Derived.
# focal_length_35mm: 43.27 / (2 tan(FOV/2)). Derived.
# preview/still: the sensor modes the drivers offer (S5KGN8 2000x1500 and
#   4000x3000; IMX712 2104x1536 and 4208x3072).
# rotation: left out until checked by eye in daylight (libcamera reports 0:
#   the device tree has no rotation yet).
# autofocus: none yet (the main camera's LC898129 has no driver).

device = "tegu"
max_zoom = 8.0

[[lens]]
role = "main"
name = "Main"
id = "/base/soc/usi@108c00c0/i2c@108c0000/camera@56" # Samsung S5KGN8
zoom = 1.0
f_number = 1.7
focal_length_35mm = 25
preview = [2000, 1500]
still = [4000, 3000]
autofocus = false

[[lens]]
role = "ultrawide"
name = "Ultrawide"
id = "/base/soc/usi@108900c0/i2c@10890000/camera@1a" # Sony IMX712
zoom = 0.5
f_number = 2.2
focal_length_35mm = 12
preview = [2104, 1536]
still = [4208, 3072]
autofocus = false

[[lens]]
role = "front"
name = "Front"
id = "/base/soc/usi@108a00c0/i2c@108a0000/camera@1a" # Sony IMX712
zoom = 1.0
f_number = 2.2
focal_length_35mm = 19
preview = [2104, 1536]
still = [4208, 3072]
autofocus = false
mirror = true
