[workspace]
resolver = "2"
members = [
    "crates/omacam-core",
    "crates/omacam-fake",
    "crates/omacam-libcamera",
    "crates/omacam",
]
# The libcamera backend needs libcamera's headers and library at build time.
# `cargo build` at the root builds the app with it; the laptop checks in
# scripts/check.sh leave it out (see docs/development.md).
default-members = [
    "crates/omacam-core",
    "crates/omacam-fake",
    "crates/omacam",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.87"
repository = "https://github.com/derekross/omacam"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
omacam-core = { path = "crates/omacam-core" }
omacam-fake = { path = "crates/omacam-fake" }
omacam-libcamera = { path = "crates/omacam-libcamera" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
async-channel = "2"
libcamera = "=0.7.0"
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }

gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_5"] }

[profile.release]
opt-level = 3
# Stripped by the linker, so a cross-built binary needs no aarch64 strip.
strip = true
